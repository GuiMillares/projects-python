<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lastro</title>

    <!-- Tema antes da primeira pintura, senão um celular no claro vê o app
         piscar escuro até o React carregar. Mesma regra do ThemeProvider. -->
    <script>
      (function () {
        var m = "aparelho";
        try { m = localStorage.getItem("fin_tema_modo") || "aparelho"; } catch (e) {}
        var claro = m === "claro" || (m !== "escuro" &&
          window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", claro ? "light" : "dark");
      })();
    </script>

    <!-- App instalável (PWA): abre em tela cheia, sem a barra de endereço.
         As cores daqui e do manifest são a exceção à regra dos tokens: o
         navegador lê antes de qualquer CSS. O ThemeProvider troca o
         theme-color pelo token do tema assim que o app carrega. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#100F0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lastro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
